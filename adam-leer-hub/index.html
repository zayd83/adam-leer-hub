<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adams leer-hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* VOICE everyday learning game for an 11-year-old with ADHD: energetic, short, clear
   IDEA a training dojo: you level up by training, every subject is a skill tree; pages are ruitjespapier
   PICTURE home: big rank emblem with XP ring and power level; subject: chapter route; practice: one big question sheet with an aura that grows with the combo
   COLOUR night-ink band #13233a with gold #f7b500; each subject keeps the colour of its own book cover
   TYPE Baloo 2 (rounded display) + Atkinson Hyperlegible (easy reading)
   LAYOUT band on top, then one clear column of cards; tools drawer at the bottom right */
:root{color-scheme:light dark;
--bg:light-dark(#fbfbf6,#0e1716);--grid:light-dark(#e5ebe6,#17231f);--ink:light-dark(#17222a,#e9f0ec);--muted:light-dark(#4f5d66,#a8b8b1);
--card:light-dark(#ffffff,#152320);--line:light-dark(#d0dad4,#2b3c35);--night:#13233a;--gold:#f7b500;--goldsoft:light-dark(#fff3c9,#3a2f0b);
--bad:light-dark(#c4304b,#ff7d93);--badsoft:light-dark(#fde7eb,#3a1820);--good:light-dark(#1d8a56,#43c487);--goodsoft:light-dark(#e2f5ea,#123323);--on:#fff;--vk:#17663f}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font:17px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Baloo 2",system-ui,sans-serif;line-height:1.08;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:clamp(32px,5vw,48px);font-weight:800}
h2{font-size:clamp(25px,3.3vw,32px);font-weight:800}
h3{font-size:21px;font-weight:600}
p{margin:.4em 0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(4vw,16px)}
main.wrap{padding-top:26px;padding-bottom:110px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{background:var(--vk);color:var(--on);padding:20px 0 28px}
.top p{color:#ffffffd9;max-width:62ch}
.top.ch{padding-bottom:0}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.back{background:transparent;border:2px solid #ffffff66;color:var(--on);border-radius:12px;padding:8px 14px;cursor:pointer;min-height:44px}
.back:hover{background:#ffffff1a}
.crumb{font-size:15px;color:#ffffffcc}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--vk);color:var(--on);border:0;border-radius:14px;padding:11px 20px;min-height:46px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 color-mix(in srgb,var(--vk) 60%,#000)}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--vk) 60%,#000)}
.btn.sec{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.gold{background:var(--gold);color:#2b2100;box-shadow:0 3px 0 #b88700}
.btn.small{min-height:38px;padding:6px 14px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px}
.note{font-size:14px;color:var(--muted);margin-top:16px}
.tip{font-size:15px;color:var(--muted)}
.hidden{display:none!important}
/* home dojo band */
.dojo{background:var(--night);color:var(--on);padding:22px 0 30px;position:relative;overflow:hidden}
.dojo::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 82% 40%,#ffffff07 0 6deg,transparent 6deg 14deg)}
.dojo .wrap{position:relative}
.dgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center}
@media(max-width:760px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.greet{font:800 clamp(30px,4.6vw,46px)/1.05 "Baloo 2",sans-serif}
.rankbox{display:flex;gap:18px;align-items:center}
.emb{width:132px;height:132px;flex:none}
.xpbar{height:16px;background:#ffffff22;border-radius:99px;overflow:hidden;margin:8px 0 4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#f7b500,#ffd75e)}
.stats3{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.pill{background:#ffffff14;border:1px solid #ffffff2a;border-radius:14px;padding:8px 12px;display:flex;gap:8px;align-items:center}
.pill b{font:800 22px/1 "Baloo 2",sans-serif;color:var(--gold)}
.pill svg{width:22px;height:22px}
.mission{background:#ffffff10;border:2px solid #ffffff22;border-radius:18px;padding:16px}
.mission .mrow{display:flex;justify-content:space-between;gap:8px;font-size:15px;margin-top:6px}
.mbar{height:10px;background:#ffffff22;border-radius:99px;overflow:hidden;margin-top:4px}.mbar i{display:block;height:100%;background:var(--gold)}
.vakken{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:14px}
@media(max-width:900px){.vakken{grid-template-columns:repeat(2,minmax(0,1fr))}}
.vak{--c:#17663f;position:relative;text-align:left;border:0;border-radius:20px;padding:16px;min-height:150px;background:var(--c);color:#fff;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 55%,#000);overflow:hidden}
.vak:hover{transform:translateY(-2px)}
.vak .ic{width:54px;height:54px}
.vak .nm{font:800 23px/1.05 "Baloo 2",sans-serif}
.vak .bk{font-size:13px;color:#ffffffcc}
.vak .pr{height:8px;background:#ffffff33;border-radius:9px;overflow:hidden;margin-top:8px}.vak .pr i{display:block;height:100%;background:#fff}
.tools{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:14px}
@media(max-width:900px){.tools{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tool{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;min-height:64px}
.tool:hover{border-color:var(--gold)}
.tool svg{width:34px;height:34px;flex:none}
.tool b{display:block;font:600 18px/1.1 "Baloo 2",sans-serif}
.tool span{font-size:14px;color:var(--muted)}
.plan{border-left:6px solid var(--gold)}
/* route */
.route{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:22px}
.stop{background:none;border:0;color:var(--on);cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:6px;border-radius:16px}
.stop:hover .ring{transform:translateY(-3px)}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),#ffffff2e 0);transition:transform .2s}
.ring b{width:74px;height:74px;border-radius:50%;background:var(--card);color:var(--vk);display:grid;place-items:center;font:800 34px/1 "Baloo 2",sans-serif}
.stop .nm{font:600 18px/1.15 "Baloo 2",sans-serif}
.stop .sc{font-size:14px;color:#ffffffcc}
.stop .txt{display:flex;flex-direction:column;gap:2px}
@media(max-width:520px){.route{grid-template-columns:minmax(0,1fr)}.stop{flex-direction:row;text-align:left;gap:14px}.ring{width:66px;height:66px;flex:none}.ring b{width:50px;height:50px;font-size:24px}}
.chk{display:inline-flex;gap:8px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;min-height:44px;background:var(--card)}
.chk input{width:20px;height:20px;accent-color:var(--vk)}
/* tabs */
.tabs{display:flex;gap:6px;margin-top:18px;flex-wrap:wrap}
.tab{background:#ffffff1f;color:var(--on);border:0;border-radius:12px 12px 0 0;padding:10px 16px;min-height:46px;font-weight:700;cursor:pointer}
.tab[aria-selected=true]{background:var(--bg);color:var(--ink)}
/* learn */
.para{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,8fr);gap:22px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:22px;margin-bottom:18px}
.pn{display:inline-block;background:var(--vk);color:var(--on);border-radius:8px;padding:0 9px;font:800 17px/1.6 "Baloo 2",sans-serif;margin-bottom:8px}
.para ul,.para ol{margin:.5em 0;padding-left:1.25em}
.para li{margin:.2em 0}
.ex{background:var(--goldsoft);border-radius:14px;padding:12px 16px;margin:10px 0}
.ex>b:first-child,.trick>b:first-child,.warn>b:first-child{display:block}
.trick{border:2px dashed var(--vk);border-radius:14px;padding:10px 16px;margin:10px 0}
.warn{border-left:5px solid var(--bad);padding:8px 14px;margin:10px 0;background:var(--badsoft);border-radius:0 12px 12px 0}
.tbl{border-collapse:collapse;margin:10px 0;font-size:16px}
.tbl td,.tbl th{border:1.5px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
.tbl th{background:color-mix(in srgb,var(--vk) 14%,transparent)}
.scroll{overflow-x:auto}
@media(max-width:760px){.para{grid-template-columns:minmax(0,1fr);gap:8px}}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.92em;line-height:1.15;margin:0 .12em}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 .2em}
i.v{font-family:Georgia,serif}
/* practice */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;min-height:42px;cursor:pointer;font-weight:700}
.chip[aria-pressed=true]{background:var(--vk);border-color:var(--vk);color:var(--on)}
@media(max-width:600px){.chip .ct{display:none}}
.sheet{position:relative;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:clamp(18px,3vw,32px);box-shadow:0 6px 0 var(--line);transition:box-shadow .4s,border-color .4s}
.sheet.a1{border-color:#5aa9ff;box-shadow:0 0 0 4px #5aa9ff33,0 0 26px #5aa9ff55}
.sheet.a2{border-color:#f7b500;box-shadow:0 0 0 5px #f7b50044,0 0 34px #f7b50088}
.sheet.a3{border-color:#c06bff;box-shadow:0 0 0 6px #c06bff44,0 0 44px #c06bff88}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:15px;margin-bottom:10px}
.combo{font-weight:700;color:var(--ink)}
.rprog{display:flex;gap:4px;margin-bottom:14px}
.rprog i{flex:1;height:10px;border-radius:9px;background:var(--grid)}
.rprog i.ok{background:var(--good)}.rprog i.no{background:var(--bad)}.rprog i.now{background:var(--gold)}
.big{font-size:clamp(20px,2.5vw,26px);line-height:1.4}
.pic{margin:14px 0;display:flex;justify-content:center}
.pic svg{width:100%;max-width:360px;height:auto;display:block}
.pic svg.wide{max-width:520px}
.pic svg text{font-family:"Atkinson Hyperlegible",sans-serif;fill:var(--ink)}
.ans{display:flex;gap:10px;align-items:center;margin-top:16px}
.ans input{font-size:22px;padding:10px 14px;border:3px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);flex:0 1 340px;width:100%;min-height:54px}
.ans input:focus{border-color:var(--vk);outline:none}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
@media(max-width:560px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{text-align:left;border:3px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 16px;min-height:54px;font-size:19px;cursor:pointer}
.opt:hover{border-color:var(--vk)}
.opt.sel{border-color:var(--vk);background:var(--goodsoft)}
.opt.right{border-color:var(--good);background:var(--goodsoft)}
.opt.wrong{border-color:var(--bad);background:var(--badsoft)}
.kl{margin-top:14px}
.kl textarea{width:100%;min-height:96px;border:2px dashed var(--line);border-radius:14px;padding:10px 12px;background:var(--bg);font:17px/1.5 "Atkinson Hyperlegible",sans-serif;resize:vertical}
.kl label{font-weight:700;font-size:15px}
.uitmode{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:15px;color:var(--muted)}
.fb{margin-top:16px;border-radius:16px;padding:14px 18px}
.fb.ok{background:var(--goodsoft)}.fb.no{background:var(--badsoft)}
.fb h3{margin-bottom:4px}
.steps2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:8px}
@media(max-width:600px){.steps2{grid-template-columns:minmax(0,1fr)}}
.steps2 pre{white-space:pre-wrap;font:16px/1.5 "Atkinson Hyperlegible",sans-serif;margin:4px 0 0;background:var(--card);border-radius:10px;padding:8px 10px}
.grade{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.grade .g{font:800 clamp(72px,12vw,110px)/1 "Baloo 2",sans-serif;color:var(--good)}
.grade .g.low{color:var(--bad)}
.rev{border-top:2px solid var(--line);padding:16px 0}
.rev .mark{font-weight:700}
.rev .mark.no{color:var(--bad)}.rev .mark.ok{color:var(--good)}
.rev .pic svg{max-width:240px}
.rev .big{font-size:19px}
/* flashcards */
.fc{perspective:1200px;max-width:620px;margin:0 auto}
.fcin{position:relative;min-height:260px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .fcin{transform:rotateY(180deg)}
.fside{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;border:3px solid var(--line);background:var(--card);display:grid;place-items:center;text-align:center;padding:24px;font:600 clamp(24px,3.6vw,34px)/1.25 "Baloo 2",sans-serif;box-shadow:0 6px 0 var(--line)}
.fside.back{transform:rotateY(180deg);border-color:var(--vk);font:400 21px/1.45 "Atkinson Hyperlegible",sans-serif}
.fside small{display:block;font:14px "Atkinson Hyperlegible",sans-serif;color:var(--muted);margin-top:10px}
.boxes{display:flex;gap:6px;justify-content:center;margin:12px 0}
.boxes span{font-size:13px;border:2px solid var(--line);border-radius:10px;padding:2px 8px}
/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.bdg{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.bdg svg{width:64px;height:64px}
.bdg.off{opacity:.42;filter:grayscale(1)}
.bdg b{display:block;font:600 17px/1.15 "Baloo 2",sans-serif;margin-top:4px}
.bdg span{font-size:13px;color:var(--muted)}
.vbars{display:grid;gap:8px;margin-top:10px}
.vb{display:grid;grid-template-columns:9em minmax(0,1fr) 4em;gap:10px;align-items:center;font-size:15px}
.vb .t{height:14px;background:var(--grid);border-radius:9px;overflow:hidden}.vb .t i{display:block;height:100%}
.vb .n{text-align:right;white-space:nowrap}
/* forms */
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.field select,.field input{font-size:17px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);min-height:46px;max-width:340px}
/* tools drawer */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:30;background:var(--night);color:#fff;border:3px solid var(--gold);border-radius:999px;padding:12px 20px;min-height:54px;font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:center;box-shadow:0 6px 18px #0005}
.fab svg{width:24px;height:24px}
.drawer{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:84px;z-index:31;width:min(380px,calc(100vw - 24px));max-height:calc(100svh - 110px);overflow:auto;background:var(--card);border:2px solid var(--line);border-radius:20px;box-shadow:0 18px 50px #0006;padding:14px}
.dtabs{display:flex;gap:6px;margin-bottom:12px}
.dtabs button{flex:1;border:2px solid var(--line);background:var(--bg);border-radius:12px;min-height:42px;font-weight:700;cursor:pointer}
.dtabs button[aria-pressed=true]{background:var(--night);color:#fff;border-color:var(--night)}
.calc input{width:100%;font-size:24px;text-align:right;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg)}
.calc .res{text-align:right;font:800 30px/1.2 "Baloo 2",sans-serif;min-height:40px;margin:6px 2px;overflow-wrap:anywhere}
.keys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.keys button{min-height:48px;border:2px solid var(--line);border-radius:12px;background:var(--bg);font-size:19px;font-weight:700;cursor:pointer}
.keys button.op{background:color-mix(in srgb,var(--gold) 22%,var(--bg))}
.keys button.eq{background:var(--gold);color:#2b2100;border-color:#b88700}
.hist{font-size:14px;color:var(--muted);margin-top:8px}
.timer{text-align:center}
.timer svg{width:190px;height:190px}
.timer .tt{font:800 42px/1 "Baloo 2",sans-serif}
.mini{position:fixed;left:50%;transform:translateX(-50%);top:10px;z-index:29;background:var(--night);color:#fff;border:2px solid var(--gold);border-radius:999px;padding:4px 14px;font-weight:700;font-size:15px;cursor:pointer}
/* fx overlay */
.fx{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#0a1220cc;cursor:pointer;animation:fin .2s}
.fx .box{text-align:center;color:#fff;padding:20px;max-width:92vw}
.fx svg{width:min(560px,90vw);height:auto;display:block;margin:0 auto}
.fx h2{font-size:clamp(40px,8vw,76px);color:var(--gold);margin-top:6px;text-shadow:0 0 24px #f7b50088}
.fx p{font-size:20px;max-width:34ch;margin:8px auto 0}
.beam{animation:beam .9s ease-out both}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes fin{from{opacity:0}to{opacity:1}}
@keyframes beam{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}
@keyframes pulse{50%{transform:scale(1.08)}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:40;background:var(--night);color:#fff;border:2px solid var(--gold);border-radius:16px;padding:10px 18px;font-weight:700;max-width:92vw;text-align:center}
.dlg{position:fixed;inset:0;z-index:60;background:#0008;display:grid;place-items:center;padding:16px}
.dlg .card{max-width:420px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ================= core: shared helpers for all subject files ================= */
window.HUB={vakken:[],P:{},u:{}};
{
const u=HUB.u;
u.ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
u.pick=a=>a[Math.floor(Math.random()*a.length)];
u.shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
u.gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
u.lcm=(a,b)=>a/u.gcd(a,b)*b;
u.red=(n,d)=>{if(d<0){n=-n;d=-d}const g=u.gcd(n,d);return [n/g,d/g]};
u.M='−';const M=u.M;
u.sn=x=>x<0?M+(-x):''+x;
u.pn=x=>x<0?'('+M+(-x)+')':''+x;
u.dec=x=>String(Math.round(x*1e6)/1e6).replace('.',',').replace('-',M);
u.eur=x=>'€ '+x.toFixed(2).replace('.',',');
u.big=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
u.fr=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
u.frS=(n,d)=>d===1?u.sn(n):(n<0?M:'')+u.fr(Math.abs(n),d);
u.frMixed=(n,d)=>{const s=n<0?M:'';n=Math.abs(n);if(d===1)return s+n;const w=Math.floor(n/d),r=n%d;return w?`${s}${w} ${u.fr(r,d)}`:s+u.fr(r,d)};
u.frAns=(n,d)=>{if(d===1)return u.sn(n);return Math.abs(n)>d?`${u.frS(n,d)} = ${u.frMixed(n,d)}`:u.frS(n,d)};
u.tail=(n,d)=>{const [a,b]=u.red(n,d);return (b!==d||Math.abs(a)>b)?' = '+u.frAns(a,b):''};
u.V=s=>s.replace(/([a-z])/g,'<i class="v">$1</i>');

/* question builders */
u.num=(q,ans,uit,o={})=>({type:'num',q,ans,uit,show:o.show||u.dec(ans),unit:o.unit||'',svg:o.svg,tol:o.tol||1e-6,hard:o.hard});
u.mc=(q,right,wrongs,uit,o={})=>{const all=[right,...wrongs].filter((v,i,a)=>a.indexOf(v)===i);const opts=u.shuffle([right,...u.shuffle(all.slice(1)).slice(0,(o.n||4)-1)]);return {type:'mc',q,ans:right,opts,uit,show:right,svg:o.svg,hard:o.hard}};
u.frq=(q,n,d,uit,o={})=>{[n,d]=u.red(n,d);return {type:'frac',q,ans:[n,d],uit,show:u.frAns(n,d),svg:o.svg,hard:o.hard}};
u.coq=(q,x,y,uit,o={})=>({type:'coord',q,ans:[x,y],uit,show:`(${u.sn(x)}, ${u.sn(y)})`,svg:o.svg});
u.alq=(q,terms,uit,o={})=>{const map={};terms.forEach(([c,k])=>{if(c)map[k]=(map[k]||0)+c});return {type:'alg',q,ans:map,uit,show:u.algShow(terms),hard:o.hard}};
u.txt=(q,answers,uit,o={})=>{answers=[].concat(answers);return {type:'txt',q,ans:answers,uit,show:o.show||answers[0],strict:o.strict,hard:o.hard,svg:o.svg,ph:o.ph}};
/* static question arrays -> objects */
u.fromStatic=a=>{const [t,q,x,y,z,o]=a;if(t==='mc')return u.mc(q,x,y,z,o||{});if(t==='txt')return u.txt(q,x,y,z||{});if(t==='num')return u.num(q,x,y,z||{});return null};
/* svg basics */
u.S=(vb,inner,cls='')=>`<svg viewBox="${vb}" class="${cls}" role="img" aria-label="tekening bij de vraag">${inner}</svg>`;
u.st='stroke="var(--ink)" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"';
u.hid='stroke="var(--ink)" stroke-width="2" fill="none" stroke-dasharray="6 5"';
u.face='fill="color-mix(in srgb,var(--vk) 22%,transparent)"';
u.face2='fill="color-mix(in srgb,var(--vk) 40%,transparent)"';
u.P2=a=>a.map(p=>p.join(',')).join(' ');

/* ================= checking ================= */
const clean=s=>String(s).trim().replace(/[−–—]/g,'-');
function parseNum(s){s=clean(s).replace(/(\d)\s*e\b/gi,'$1').replace(/€|euro|°c|°|%|cm|km²|km|graden|uur|dagen|keer|jaar|eeuw|v\.?\s?chr\.?|n\.?\s?chr\.?|inwoners|per|x\b/gi,'').replace(/\s+/g,'');if(!s)return NaN;if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'');s=s.replace(',','.');if(!/^-?\d*\.?\d+$/.test(s))return NaN;return Number(s)}
function parseFrac(s){s=clean(s);let m;
 if(m=s.match(/^(-)?\s*(\d+)\s+(\d+)\s*\/\s*(\d+)$/)){const d=+m[4];if(!d)return null;return {n:(m[1]?-1:1)*(+m[2]*d+ +m[3]),d,mixed:true,r:+m[3]}}

function parseAlg(s){s=clean(s).toLowerCase().replace(/[\s·*×]/g,'').replace(/²/g,'^2').replace(/³/g,'^3');if(!s)return null;
 const terms=s.match(/[+-]?[^+-]+/g);if(!terms||terms.join('')!==s)return null;const map={};let simple=true;
 for(const t of terms){const m=t.match(/^([+-]?)(\d+(?:[.,]\d+)?)?((?:[a-z](?:\^\d+)?)*)$/);if(!m||(!m[2]&&!m[3]))return null;
  let c=m[2]?Number(m[2].replace(',','.')):1;if(m[1]==='-')c=-c;const pw={};

const lev=(a,b)=>{const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]};
function check(q,raw){
 const r=String(raw??'').trim();if(!r)return {ok:false,empty:true};
 if(q.type==='mc')return {ok:r===q.ans};
 if(q.type==='num'){const v=parseNum(r);if(isNaN(v))return {ok:false,fmt:true,msg:'Typ alleen een getal, bijvoorbeeld 12 of 3,5.'};return {ok:Math.abs(v-q.ans)<q.tol}}
 if(q.type==='frac'){const f=parseFrac(r);if(!f)return {ok:false,fmt:true,msg:'Schrijf een breuk zo: 3/4, of met helen zo: 2 1/3.'};
  const [n,d]=q.ans;if(f.n*d!==n*f.d)return {ok:false};

  if(f.mixed){if(f.r>=f.d||u.gcd(f.r,f.d)!==1)return {ok:false,msg:'De waarde klopt, maar het kan nog eenvoudiger.'};return {ok:true}}

 if(q.type==='alg'){const a=parseAlg(r);if(!a)return {ok:false,fmt:true,msg:'Schrijf het zo: 3a + 5b of 12ab of 6x².'};
  const ks=new Set([...Object.keys(a.map),...Object.keys(q.ans)]);let same=true;ks.forEach(k=>{if(Math.abs((a.map[k]||0)-(q.ans[k]||0))>1e-9)same=false});

  const na=deacc(n);const ia=A.findIndex(a=>deacc(a)===na);if(ia>=0)return {ok:true,warn:'Let op de accenten! Precies goed is: <b>'+esc(q.ans[ia])+'</b>'};

  return {ok:false}}
 return {ok:false};
}

let test=null;

function testView(ch){
 let v;if(ch){v=V(ch.vak);app.innerHTML=shell({kleur:v.kleur,title:`H${ch.n} ${ch.t}`,back:'vak-'+v.id,backTxt:v.naam,tabs:chTabs(ch,'toets')})}
 else{if(!test){location.hash='home';return}app.innerHTML=shell({kleur:test.kleur,title:test.title,back:test.back,backTxt:'Terug'})}
 bindGo();const body=document.getElementById('body');const key=ch?ch.key:test.key;
 if(!test||test.key!==key){

  document.getElementById('go').onclick=()=>{startTest({pool:ch.ps.map(p=>p.key),n:12,key,title:`H${ch.n} ${ch.t}`,back:ch.key,kleur:v.kleur,ch:ch.key});testView(ch)};return}
 if(test.done)return results(ch,body);
 const q=test.qs[test.i];let sel=null;
 body.innerHTML=`<section class="sheet"><div class="qhead"><span>Vraag ${test.i+1} van ${test.qs.length}</span><span>${V(HUB.P[q.p].vak).naam} · § ${HUB.P[q.p].id}</span></div><div class="rprog">${test.qs.map((_,i)=>`<i class="${i<test.i?'ok':i===test.i?'now':''}" style="${i<test.i?'background:var(--vk)':''}"></i>`).join('')}</div>${qHtml(q)}${inputHtml(q)}<div class="row" style="margin-top:16px"><button class="btn" id="nx">${test.i===test.qs.length-1?'Inleveren':'Volgende vraag'}</button><button class="btn sec" id="stop">Stoppen</button></div><p id="warn" class="tip"></p></section>`;
 const inp=document.getElementById('inp');
 body.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{body.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=q.opts[+b.dataset.o]});
 const go=()=>{const val=inp?inp.value:sel;if(val===null||String(val).trim()===''){const w=document.getElementById('warn');if(!w.dataset.once){w.dataset.once=1;w.textContent='Je hebt nog niets ingevuld. Weet je het echt niet? Klik nog een keer om door te gaan.';return}}
  test.ans[test.i]=val??'';test.i++;if(test.i>=test.qs.length){test.done=true;finish()}testView(ch)};
 document.getElementById('nx').onclick=go;document.getElementById('stop').onclick=()=>{test=null;ch?testView(ch):(location.hash=prac&&prac.back||'home')};
 if(inp){inp.focus({preventScroll:true});inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go()}}}
}
function finish(){const res=test.qs.map((q,i)=>check(q,test.ans[i]));test.res=res;const ok=res.filter(r=>r.ok).length;
 test.grade=Math.round((1+9*ok/test.qs.length)*10)/10;test.ok=ok;D.last[test.key]=test.grade;if(!D.best[test.key]||test.grade>D.best[test.key])D.best[test.key]=test.grade;
 test.qs.forEach((q,i)=>{recordAnswer(q,res[i].ok);if(!res[i].ok)addFout(q,test.ans[i],'')});
 if(test.grade>=8)badge('t8');if(test.grade>=10)badge('t10');addXP(Math.round(test.grade*10));
 setTimeout(()=>{if(test.grade>=8)fx('level',test.grade>=10?'Hokage-niveau!':'Chūnin-examen gehaald!',`Een ${dec(test.grade)}! +${Math.round(test.grade*10)} XP.`);else if(test.grade>=5.5)fx('flame','Voldoende!',`Een ${dec(test.grade)}. Werk je fouten weg en je gaat nog hoger.`)},300)}
function results(ch,body){const t=test;const mins=Math.max(1,Math.round((Date.now()-t.t0)/60000));const wrongPs=[...new Set(t.qs.filter((q,i)=>!t.res[i].ok).map(q=>q.p))];
 const msg=t.grade>=8?'Super gedaan! Deze stof zit erin.':t.grade>=5.5?'Voldoende! Werk de rode vragen weg, dan wordt het nog beter.':'Nog niet voldoende. Geen probleem: lees de uitleg van de rode paragrafen en oefen ze. Elke sensei begon ooit onderaan.';
 body.innerHTML=`<section class="sheet"><div class="grade"><span class="g ${t.grade<5.5?'low':''}">${dec(t.grade)}</span><div><h2>${t.ok} van de ${t.qs.length} goed</h2><p>${msg}</p><p class="tip">Tijd: ongeveer ${mins} ${mins===1?'minuut':'minuten'} · +${Math.round(t.grade*10)} XP</p></div></div>
 <div class="row" style="margin-top:14px">${wrongPs.length?`<button class="btn gold" id="fix">Oefen je fouten</button>`:''}<button class="btn sec" id="again">Nieuwe toets</button></div>
 <h3 style="margin-top:24px">Na-checker</h3>${t.qs.map((q,i)=>{const r=t.res[i];return `<div class="rev"><p class="mark ${r.ok?'ok':'no'}">Vraag ${i+1}: ${r.ok?'goed':'fout'} <span class="tip">(§ ${HUB.P[q.p].id} ${HUB.P[q.p].t})</span></p>${qHtml(q)}<p>Jouw antwoord: <b>${q.type==='mc'&&t.ans[i]?t.ans[i]:esc(t.ans[i]||'niets ingevuld')}</b>${r.ok?'':` · Goed antwoord: <b>${q.show}</b>`}</p>${r.warn?`<p>${r.warn}</p>`:''}${r.ok?'':`<p>${q.uit}</p>`}</div>`}).join('')}</section>`;
 const f=document.getElementById('fix');if(f)f.onclick=()=>{startPrac({pool:wrongPs,queue:shuffle(wrongPs.concat(wrongPs)).slice(0,ROUND),title:'Fouten oefenen',back:ch?ch.key:t.back,kleur:t.kleur});test=null;location.hash='training'};
 document.getElementById('again').onclick=()=>{const o=Object.assign({},t);test=null;if(ch)testView(ch);else{startTest({pool:o.pool,n:o.n,key:o.key,title:o.title,back:o.back,kleur:o.kleur});testView(null)}};
}

  const testT=chs.map(k=>({h:k+'-toets',l:`Oefentoets H${CHK(k).n}`}));const tasks=days.map(dd=>({d:dd,items:[]}));
  const nl=Math.max(1,days.length-1);learnT.forEach((x,i)=>tasks[Math.min(nl-1,Math.floor(i*nl/learnT.length))].items.push(x));
  tasks[tasks.length-1].items.push(...testT,{h:'fouten',l:'Foutenboek leeg maken'});
  D.plans=D.plans.filter(p=>p.date>=today());D.plans.push({vak:v.id,date,chs,tasks});save();toast('Planning gemaakt!');list()};
 const list=()=>{const ps=D.plans.filter(p=>p.date>=today()).sort((a,b)=>a.date<b.date?-1:1);document.getElementById('plist').innerHTML=ps.map((p,pi)=>`<section class="card plan" style="margin-top:18px"><div class="bar"><h2>${V(p.vak).naam} · ${new Date(p.date+'T12:00').toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'})}</h2><button class="btn small sec" data-del="${D.plans.indexOf(p)}">Verwijderen</button></div>${p.tasks.map(t=>`<p style="margin-top:10px"><b>${t.d===today()?'Vandaag':new Date(t.d+'T12:00').toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'short'})}</b></p><div class="row">${t.items.map(x=>`<button class="btn small ${t.d===today()?'':'sec'}" data-go="${x.h}">${x.l}</button>`).join('')}</div>`).join('')}<p class="tip" style="margin-top:10px">Elke dag 15 tot 25 minuten. Zet de focustimer aan.</p></section>`).join('');bindGo(document.getElementById('plist'));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{D.plans.splice(+b.dataset.del,1);save();list()})};
 list()}

/* ---------- settings ---------- */
function settings(){const d=document.createElement('div');d.className='dlg';d.innerHTML=`<div class="card"><h2>Instellingen</h2><label class="chk" style="margin-top:10px"><input type="checkbox" id="snd" ${D.set.sound?'checked':''}> Geluidjes aan</label><p style="margin-top:14px"><b>Alles opnieuw beginnen</b></p><p class="tip">Wist XP, badges, voortgang, foutenboek en planning op dit apparaat.</p><div class="row"><button class="btn sec" id="rs">Alles wissen</button><button class="btn" id="cl">Sluiten</button></div><p id="rsq" class="hidden" style="margin-top:10px">Zeker weten? <button class="btn small" id="rsy" style="background:var(--bad)">Ja, wis alles</button></p></div>`;document.body.appendChild(d);
 d.onclick=e=>{if(e.target===d)d.remove()};d.querySelector('#cl').onclick=()=>d.remove();d.querySelector('#snd').onchange=e=>{D.set.sound=e.target.checked;save()};d.querySelector('#rs').onclick=()=>d.querySelector('#rsq').classList.remove('hidden');d.querySelector('#rsy').onclick=()=>{D=fresh();save();d.remove();toast('Alles gewist. Nieuwe start!');route()}}

/* ================= tools drawer ================= */
let drawerTab='calc';
const fab=document.createElement('button');fab.className='fab';fab.innerHTML=`${TI.calc.replace('viewBox','width="24" height="24" viewBox')}<span>Tools</span>`;fab.setAttribute('aria-label','Tools: rekenmachine, focustimer, kladblok');document.body.appendChild(fab);
const dr=document.createElement('div');dr.className='drawer hidden';document.body.appendChild(dr);
fab.onclick=()=>{dr.classList.contains('hidden')?openDrawer(drawerTab):dr.classList.add('hidden')};
function openDrawer(t){drawerTab=t;dr.classList.remove('hidden');dr.innerHTML=`<div class="dtabs">${[['calc','Rekenen'],['timer','Timer'],['kl','Kladblok']].map(([k,l])=>`<button aria-pressed="${t===k}" data-dt="${k}">${l}</button>`).join('')}</div><div id="dbody"></div><div style="text-align:right;margin-top:10px"><button class="btn small sec" id="dclose">Sluiten</button></div>`;
 dr.querySelectorAll('[data-dt]').forEach(b=>b.onclick=()=>openDrawer(b.dataset.dt));dr.querySelector('#dclose').onclick=()=>dr.classList.add('hidden');
 const db=dr.querySelector('#dbody');if(t==='calc')calcUI(db);if(t==='timer')timerUI(db);if(t==='kl'){db.innerHTML=`<div class="kl" style="margin:0"><label for="notes">Kladblok (blijft bewaard op dit apparaat)</label><textarea id="notes" style="min-height:220px">${esc(D.notes||'')}</textarea></div>`;const ta=db.querySelector('#notes');ta.oninput=()=>{D.notes=ta.value;save()}}}
/* calculator: own parser, no eval */
function calcEval(s){s=s.replace(/\s/g,'').replace(/,/g,'.').replace(/[×x*]/g,'*').replace(/[:÷/]/g,'/').replace(/[−–]/g,'-').replace(/²/g,'^2');let i=0;
 const peek=()=>s[i];const num=()=>{const m=s.slice(i).match(/^\d*\.?\d+/);if(!m)throw 0;i+=m[0].length;return +m[0]};
 const prim=()=>{let v;if(peek()==='('){i++;v=expr();if(s[i++]!==')')throw 0}else if(peek()==='√'){i++;v=Math.sqrt(prim())}else if(s.slice(i,i+3)==='ans'){i+=3;v=lastAns}else v=num();while(peek()==='%'){i++;v/=100}return v};
 const pow=()=>{let b=prim();if(peek()==='^'){i++;return b**fac()}return b};
 const fac=()=>{if(peek()==='-'){i++;return -fac()}if(peek()==='+'){i++;return fac()}return pow()};
 const term=()=>{let v=fac();while(peek()==='*'||peek()==='/'||peek()==='('||peek()==='√'){const o=peek();if(o==='('||o==='√'){v*=fac();continue}i++;const r=fac();v=o==='*'?v*r:v/r}return v};
 const expr=()=>{let v=term();while(peek()==='+'||peek()==='-'){const o=s[i++];const r=term();v=o==='+'?v+r:v-r}return v};
 const v=expr();if(i<s.length)throw 0;return v}
let lastAns=0,hist=[];
function calcUI(db){db.innerHTML=`<div class="calc"><input id="ce" inputmode="none" aria-label="Som" placeholder="bijv. (3+4)×2"><div class="res" id="cr">&nbsp;</div><div class="keys">${['7','8','9',':','C','4','5','6','×','⌫','1','2','3','−','(','0',',','%','+',')','x²','√','ans','=',''].map(k=>k?`<button class="${/[:×−+=]/.test(k)?(k==='='?'eq':'op'):''}" data-k="${k}">${k}</button>`:'<span></span>').join('')}</div><div class="hist" id="ch"></div><p class="tip">Typ ook gewoon met je toetsenbord. Gebruik de rekenmachine alleen als dat bij jouw toets mag.</p></div>`;
 const ce=db.querySelector('#ce'),cr=db.querySelector('#cr'),ch=db.querySelector('#ch');const showH=()=>ch.innerHTML=hist.map(h=>`<div>${esc(h)}</div>`).join('');showH();
 const calc=()=>{try{const v=calcEval(ce.value||'0');if(!isFinite(v))throw 0;lastAns=v;const out=dec(Math.round(v*1e10)/1e10);cr.textContent=out;hist.unshift(ce.value+' = '+out);hist=hist.slice(0,5);showH()}catch(e){cr.textContent='Klopt niet, check je som'}};
 ce.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();calc()}};
 db.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==='C'){ce.value='';cr.innerHTML='&nbsp;'}else if(k==='⌫')ce.value=ce.value.slice(0,-1);else if(k==='=')calc();else ce.value+=k==='x²'?'²':k==='ans'?'ans':k;sfx('tick')})}
/* focus timer */
let TM=null;const mini=document.createElement('div');mini.className='mini hidden';document.body.appendChild(mini);mini.onclick=()=>openDrawer('timer');
function timerUI(db){const R=80,c=2*Math.PI*R;const draw=()=>{const left=TM?Math.max(0,TM.end-Date.now()):0;const fr2=TM?left/TM.dur:1;const mm=Math.floor(left/60000),ss=Math.floor(left/1000)%60;
  db.innerHTML=`<div class="timer"><svg viewBox="0 0 190 190"><circle cx="95" cy="95" r="${R}" fill="none" stroke="var(--grid)" stroke-width="14"/><circle cx="95" cy="95" r="${R}" fill="none" stroke="${TM&&TM.phase==='pauze'?'#5aa9ff':'var(--gold)'}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${c*fr2} ${c}" transform="rotate(-90 95 95)"/><text x="95" y="104" text-anchor="middle" font-size="34" font-weight="800" font-family="Baloo 2,sans-serif" fill="var(--ink)">${TM?`${mm}:${String(ss).padStart(2,'0')}`:'klaar'}</text></svg><p><b>${TM?(TM.phase==='focus'?'Focus! Alleen deze taak.':'Pauze: sta op, drink water.'):'Kies een focusronde'}</b></p>
  <div class="row" style="justify-content:center">${TM?'<button class="btn sec" id="tstop">Stop</button>':[10,15,20,25].map(m=>`<button class="btn small" data-m="${m}">${m} min</button>`).join('')}</div><p class="tip">Tip: telefoon weg, één vak tegelijk. Na de ronde krijg je 5 minuten pauze en +15 XP.</p></div>`;
  db.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{startTimer(+b.dataset.m,'focus');draw()});const st=db.querySelector('#tstop');if(st)st.onclick=()=>{clearInterval(TM.id);TM=null;mini.classList.add('hidden');draw()}};
 draw();clearInterval(db._iv);db._iv=setInterval(()=>{if(!document.body.contains(db)||dr.classList.contains('hidden')||drawerTab!=='timer')return clearInterval(db._iv);draw()},1000)}
function startTimer(min,phase){if(TM)clearInterval(TM.id);TM={dur:min*60000,end:Date.now()+min*60000,phase};mini.classList.remove('hidden');
 TM.id=setInterval(()=>{const left=TM.end-Date.now();mini.textContent=`${TM.phase==='focus'?'Focus':'Pauze'} ${Math.floor(Math.max(0,left)/60000)}:${String(Math.floor(Math.max(0,left)/1000)%60).padStart(2,'0')}`;
  if(left<=0){clearInterval(TM.id);if(TM.phase==='focus'){addXP(15);badge('focus');fx('timer','Focusronde klaar!','+15 XP. Nu 5 minuten pauze: even bewegen.');startTimer(5,'pauze')}else{TM=null;mini.classList.add('hidden');fx('timer','Pauze voorbij','Klaar voor de volgende ronde? Open de timer bij Tools.')}}},1000)}

/* ================= router ================= */
function route(){const h=location.hash.slice(1)||'home';window.scrollTo(0,0);dr.classList.add('hidden');
 if(h==='home')return home();if(h==='training')return practiceView(null);if(h==='toets')return testView(null);if(h==='fouten')return foutenView();if(h==='pad')return padView();if(h==='planner')return plannerView();
 if(h.startsWith('vak-')){const v=V(h.slice(4));if(v)return vakView(v)}
 const parts=h.split('-');const ch=CHK(parts[0]+'-'+parts[1]);
 if(ch){if(parts[2]==='oefenen')return practiceView(ch);if(parts[2]==='toets')return testView(ch);if(parts[2]==='kaarten'&&ch.cards)return cardsView(ch);return learn(ch)}
 home()}
window.addEventListener('hashchange',route);
route();
window.__t={check,makeQ,parseAlg,D:()=>D};
}
